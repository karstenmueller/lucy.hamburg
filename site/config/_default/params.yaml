assets:
  disableHLJS: true 
  favicon: "/favicon.ico"
  favicon16x16: "/favicon-16x16.png"
  favicon32x32: "/favicon-32x32.png"
  apple_touch_icon: "/apple-touch-icon.png"
  safari_pinned_tab: "/apple-touch-icon.png"

# blowfish
showLikes: true # requires firebase integration
colorScheme: "congo"
defaultAppearance: "light"
defaultFeaturedImage: "images/lucy_racing.jpg"
smartTOC: true
logo: "images/logo/lucy_logo.png"
secondaryLogo: "images/logo/lucy_logo_dark.png"
mainSections: ["posts", "cruising", "doc"]

article:
  showHero: true
  showLikes: true # requires firebase integration
  showAuthor: false
  heroStyle: thumbAndBackground # valid options: basic, big, background, thumbAndBackground
  layoutBackgroundHeaderSpace: false
  showDateUpdated: true
  showEdit: true
  editURL: "https://github.com/karstenmueller/lucy.hamburg/edit/main/site/content"
  showReadingTime: false
  showTableOfContents: true # set false in articles header
  showTaxonomies: true

homepage:
  layout: background
  homepageImage: "images/lucy_racing.jpg"
  showRecent: true
  showRecentItems: 6
  showMoreLink: true
  showMoreLinkDest: "/posts"
  cardView: true

list:
  showHero: true
  heroStyle: background
  showCards: true

