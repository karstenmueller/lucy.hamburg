gpx:
  # --- Map Provider (Tile Layers) ---
  # Default active layer. Options: "osm", "topo", "satellite", "sea"
  defaultLayer: "osm"

  # --- Default View ---
  # Initial center if no GPX is loaded
  startLat: 53.544439
  startLon: 9.856367
  startZoom: 9

  # Track Line Style
  lineWeight: 3
  lineOpacity: 0.8
  
  # --- Marine ---
  seaUrl: "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png"
  seaAttr: "Map data: © OpenSeaMap contributors"

  # --- Default Toggles ---
  show-stats: false
  elevation: false
  elevation-info: false
  markers: true
  show-unit-toggle: true  # Show km/nm toggle button (starts in nm mode)
  show-seamarks: true    # Show Seamarks overlay option in layer control
  show-route-selector: false # Show/Hide the route selection panel
  
  markerStartColor: "#2ecc71"
  markerEndColor: "#383E42"
